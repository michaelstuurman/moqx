<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Source Sans Pro, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .node { fill: #f1f3f5; stroke: #868e96; stroke-width: 2; }
      .hook { fill: #ffe8cc; stroke: #e8590c; stroke-width: 2.5; }
      .fixed { fill: #e9ecef; stroke: #868e96; stroke-width: 2; }
      .may { fill: #d3f9d8; stroke: #2f9e44; stroke-width: 2; }
      .drop { fill: #fff5f5; stroke: #e03131; stroke-width: 2; }
      .t { font-size: 24px; fill: #212529; text-anchor: middle; }
      .s { font-size: 17px; fill: #495057; text-anchor: middle; }
      .lbl { font-size: 22px; fill: #868e96; font-weight: bold; }
      .e { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <text class="lbl" x="30" y="70">object</text>
  <rect class="fixed" x="30" y="85" width="280" height="70"/>
  <text class="t" x="170" y="117">location, subgroup</text>
  <text class="s" x="170" y="142">fixed: the host routes by them</text>
  <rect class="may" x="30" y="155" width="280" height="70"/>
  <text class="t" x="170" y="187">properties</text>
  <text class="s" x="170" y="212">a filter may change them</text>
  <rect class="fixed" x="30" y="225" width="280" height="70"/>
  <text class="t" x="170" y="257">payload</text>
  <text class="s" x="170" y="282">immutable</text>

  <rect class="hook" x="400" y="155" width="200" height="70" rx="8"/>
  <text class="t" x="500" y="198">filter</text>

  <path class="e" d="M310,190 H398"/>

  <rect class="node" x="720" y="45" width="300" height="70" rx="8"/>
  <text class="t" x="870" y="77">forward</text>
  <text class="s" x="870" y="102">to the next filter</text>
  <rect class="may" x="720" y="155" width="300" height="70" rx="8"/>
  <text class="t" x="870" y="187">short-circuit</text>
  <text class="s" x="870" y="212">straight to the consumer</text>
  <rect class="drop" x="720" y="265" width="300" height="70" rx="8"/>
  <text class="t" x="870" y="297">drop</text>
  <text class="s" x="870" y="322">never delivered</text>

  <path class="e" d="M600,180 C660,180 660,80 718,80"/>
  <path class="e" d="M600,190 H718"/>
  <path class="e" d="M600,200 C660,200 660,300 718,300"/>
</svg>
