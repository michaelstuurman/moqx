<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Source Sans Pro, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .node { fill: #f1f3f5; stroke: #868e96; stroke-width: 2; }
      .hook { fill: #ffe8cc; stroke: #e8590c; stroke-width: 2.5; }
      .lane { fill: none; stroke: #ced4da; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .t { font-size: 24px; fill: #212529; text-anchor: middle; }
      .s { font-size: 17px; fill: #495057; text-anchor: middle; }
      .lbl { font-size: 22px; fill: #868e96; font-weight: bold; }
      .e { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#a); }
      .att { stroke: #c2410c; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#d); }
      .attl { font-size: 17px; fill: #c2410c; }
    </style>
  </defs>

  <!-- lanes -->
  <rect class="lane" x="10" y="20" width="1180" height="250" rx="12"/>
  <text class="lbl" x="28" y="52">Control plane: per session, request, announcement</text>
  <rect class="lane" x="10" y="300" width="1180" height="285" rx="12"/>
  <text class="lbl" x="28" y="332">Data plane: per object</text>

  <!-- control row -->
  <rect class="node" x="40" y="90" width="130" height="64" rx="8"/>
  <text class="t" x="105" y="130">Peer</text>

  <rect class="hook" x="220" y="90" width="160" height="64" rx="8"/>
  <text class="t" x="300" y="118">admit</text>
  <text class="s" x="300" y="142">once per session</text>

  <rect class="hook" x="430" y="90" width="180" height="64" rx="8"/>
  <text class="t" x="520" y="118">authorize</text>
  <text class="s" x="520" y="142">per request</text>

  <rect class="node" x="660" y="90" width="130" height="64" rx="8"/>
  <text class="t" x="725" y="130">Relay</text>

  <rect class="hook" x="850" y="90" width="300" height="64" rx="8"/>
  <text class="t" x="1000" y="118">announcement policy</text>
  <text class="s" x="1000" y="142">accept, forward, outgoing params</text>

  <rect class="hook" x="850" y="185" width="300" height="64" rx="8"/>
  <text class="t" x="1000" y="213">fetch middleware</text>
  <text class="s" x="1000" y="237">serve from cache, or pass upstream</text>

  <path class="e" d="M170,122 H218"/>
  <path class="e" d="M380,122 H428"/>
  <path class="e" d="M610,122 H658"/>
  <path class="e" d="M790,122 H848"/>
  <path class="e" d="M790,140 C820,140 815,217 848,217"/>

  <!-- data row -->
  <rect class="node" x="40" y="380" width="140" height="64" rx="8"/>
  <text class="t" x="110" y="420">Publisher</text>

  <rect class="hook" x="230" y="380" width="180" height="64" rx="8"/>
  <text class="t" x="320" y="408">ingress filters</text>
  <text class="s" x="320" y="432">publisher's worker</text>

  <rect class="node" x="460" y="380" width="160" height="64" rx="8"/>
  <text class="t" x="540" y="420">Relay fanout</text>

  <rect class="hook" x="670" y="380" width="180" height="64" rx="8"/>
  <text class="t" x="760" y="408">egress filters</text>
  <text class="s" x="760" y="432">subscriber's worker</text>

  <rect class="node" x="900" y="380" width="150" height="64" rx="8"/>
  <text class="t" x="975" y="420">Subscriber</text>

  <rect class="hook" x="450" y="495" width="180" height="64" rx="8"/>
  <text class="t" x="540" y="523">cache observer</text>
  <text class="s" x="540" y="547">ingest tap</text>

  <path class="e" d="M180,412 H228"/>
  <path class="e" d="M410,412 H458"/>
  <path class="e" d="M620,412 H668"/>
  <path class="e" d="M850,412 H898"/>
  <path class="e" d="M540,444 V493"/>

  <!-- control attaches filters -->
  <path class="att" d="M500,154 C470,260 340,290 325,378"/>
  <path class="att" d="M560,154 C600,260 740,290 755,378"/>
  <text class="attl" x="560" y="286" text-anchor="middle">attach filters to this request</text>
</svg>
