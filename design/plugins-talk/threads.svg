<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Source Sans Pro, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .node { fill: #f1f3f5; stroke: #868e96; stroke-width: 2; }
      .hook { fill: #ffe8cc; stroke: #e8590c; stroke-width: 2.5; }
      .t { font-size: 24px; fill: #212529; text-anchor: middle; }
      .s { font-size: 17px; fill: #495057; text-anchor: middle; }
      .l { font-size: 18px; fill: #495057; text-anchor: middle; }
      .e { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#a); }
      .p { stroke: #444; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect class="hook" x="40" y="60" width="280" height="180" rx="8"/>
  <text class="t" x="180" y="158">plugin thread</text>

  <rect class="node" x="880" y="60" width="280" height="180" rx="8"/>
  <text class="t" x="1020" y="140">relay</text>
  <text class="s" x="1020" y="168">I/O workers, coordinator</text>

  <path class="e" d="M320,95 H878"/>
  <text class="l" x="600" y="85">attach or detach filters: directly</text>

  <path class="e" d="M320,150 H878"/>
  <text class="l" x="600" y="140">complete a filter callback: the host forwards</text>

  <path class="p" d="M320,205 H878"/>
  <text class="l" x="600" y="195">anything else: through a host bridge</text>
</svg>
