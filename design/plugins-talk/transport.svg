<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="Source Sans Pro, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .node { fill: #f1f3f5; stroke: #868e96; stroke-width: 2; }
      .hook { fill: #ffe8cc; stroke: #e8590c; stroke-width: 2.5; }
      .lane { fill: none; stroke: #ced4da; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .t { font-size: 24px; fill: #212529; text-anchor: middle; }
      .s { font-size: 17px; fill: #495057; text-anchor: middle; }
      .lbl { font-size: 22px; fill: #868e96; font-weight: bold; }
      .e { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#a); }
      .p { stroke: #444; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect class="lane" x="190" y="20" width="660" height="180" rx="12"/>
  <text class="lbl" x="208" y="52">Transport: per listener, per handshake</text>

  <rect class="node" x="20" y="90" width="130" height="70" rx="8"/>
  <text class="t" x="85" y="133">Client</text>

  <rect class="hook" x="220" y="90" width="260" height="70" rx="8"/>
  <text class="t" x="350" y="120">CertManager</text>
  <text class="s" x="350" y="145">pick the chain by SNI</text>

  <rect class="hook" x="540" y="90" width="280" height="70" rx="8"/>
  <text class="t" x="680" y="120">AsyncSelfCert</text>
  <text class="s" x="680" y="145">sign the handshake</text>

  <rect class="node" x="900" y="90" width="270" height="70" rx="8"/>
  <text class="t" x="1035" y="120">MoQT session</text>
  <text class="s" x="1035" y="145">then admit</text>

  <rect class="node" x="560" y="250" width="240" height="70" rx="8"/>
  <text class="t" x="680" y="280">key service</text>
  <text class="s" x="680" y="305">outside moqx</text>

  <path class="e" d="M150,125 H218"/>
  <path class="e" d="M480,125 H538"/>
  <path class="e" d="M820,125 H898"/>
  <path class="p" d="M665,160 V248"/>
  <path class="p" d="M695,248 V162"/>
</svg>
