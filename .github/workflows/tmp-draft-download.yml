name: tmp draft download

# TEMPORARY, delete before merging ci/pgo-release-consumers. Checks that
# version-release's release-image job can download an asset from a draft
# release: its GITHUB_TOKEN carries packages permission only, so it needs the
# app token. Creates a throwaway draft, downloads it both ways, deletes it.

on:
  push:
    branches: [ci/pgo-release-consumers]
    paths: ['.github/workflows/tmp-draft-download.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DRAFT_TAG: tmp-draft-download-${{ github.run_id }}

jobs:
  make-draft:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create a throwaway draft release with one asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "draft download check" > moqx-linux-amd64.tar.gz
          gh release create "$DRAFT_TAG" --draft --target "$GITHUB_SHA" \
            --title "$DRAFT_TAG (temporary)" --notes "Temporary; the same run deletes it." \
            moqx-linux-amd64.tar.gz

  download:
    needs: make-draft
    runs-on: ubuntu-22.04
    # Same permissions as release-image.
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OMOQ_APP_ID }}
          private-key: ${{ secrets.OMOQ_APP_PRIV_KEY }}

      - name: Job token alone (the code before the fix)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$DRAFT_TAG" --pattern moqx-linux-amd64.tar.gz --dir _old --clobber; then
            RESULT="downloaded: the job token can read the draft after all"
          else
            RESULT="refused, as expected"
          fi
          echo "job token alone: $RESULT"
          echo "- job token alone: $RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: App token as GH_TOKEN (the fix, same env as release-image)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release download "$DRAFT_TAG" --pattern moqx-linux-amd64.tar.gz --dir _new --clobber
          grep -q 'draft download check' _new/moqx-linux-amd64.tar.gz
          echo "app token: downloaded"
          echo "- app token as GH_TOKEN: downloaded" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [make-draft, download]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # A draft holds no tag ref, so there is no tag to clean up.
      - name: Delete the throwaway draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$DRAFT_TAG" --yes
